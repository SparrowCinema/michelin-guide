name: Validate guide
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/core.test.js tests/intro.test.js tests/route.test.js
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/check_updates.py --validate-only
      - run: node --check upgrade.js && node --check guide-core.js && node --check sw.js && node --check passport-share.js && node --check address-localization.js && node --check meal-photos.js && node --check restaurant-intro.js && node --check trip-route.js
