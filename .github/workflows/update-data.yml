name: Monthly data update
# On the 3rd of every month: fetch the upstream MICHELIN CSV, and if any restaurant was
# added, removed or changed award, rebuild data.json and open a pull request to review and merge.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 3 * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch upstream CSV
        run: curl -fsSL --retry 3 -o /tmp/upstream.csv https://raw.githubusercontent.com/ngshiheng/michelin-my-maps/main/data/michelin_my_maps.csv
      - name: Compare with published data
        id: cmp
        run: |
          python tools/check_updates.py --candidate /tmp/upstream.csv --out /tmp/report.json
          python - <<'PY'
          import json, os
          r = json.load(open('/tmp/report.json'))
          n = sum(len(r[k]) for k in ('added', 'removed', 'award_changes'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'changes={n}\n')
          PY
      - name: Rebuild data.json
        if: steps.cmp.outputs.changes != '0'
        run: |
          TODAY=$(date -u +%F)
          python tools/build.py /tmp/upstream.csv tools/cn_mainland_curated.json data.json \
            tools/zh_official_names.json tools/reference_translations.tsv \
            tools/history.json tools/black_pearl_2026.json "$TODAY"
          sed -i -E "s/const DATA_VER=\"[^\"]*\"/const DATA_VER=\"$(date -u +%Y%m%d)-auto\"/" index.html
          python tools/check_updates.py --validate-only
          python tools/update_summary.py /tmp/report.json > /tmp/pr-body.md
      - name: Open pull request
        if: steps.cmp.outputs.changes != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="data/update-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data.json index.html
          git commit -m "data: monthly MICHELIN update $(date -u +%F)"
          git push -f origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
          else
            gh pr create --head "$BRANCH" --base main --title "数据更新：米其林名单 $(date -u +%Y-%m)" --body-file /tmp/pr-body.md \
              || echo "::warning::Could not open the PR. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open it from branch $BRANCH."
          fi
          cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"
      - name: No changes
        if: steps.cmp.outputs.changes == '0'
        run: echo "上游名单与网站数据一致，本月无需更新。" >> "$GITHUB_STEP_SUMMARY"
